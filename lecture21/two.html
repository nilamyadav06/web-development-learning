<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      border: 2px solid black;
      background-color: bisque;
      display: flex;
      flex-direction: row;
      width: 400px;
      padding: 2px;
      margin: 10px;

    }

    #boxleft {
      border: 1px solid black;
      background-color: darkgray;
      width: 47%;
      margin: 3px;
      padding: 2px;
      display: flex;
      flex-direction: column;


    }

    #boxright {
      border: 1px solid black;
      background-color: rgb(171, 160, 160);
      width: 47%;
      margin: 3px;
      padding: 2px;

    }

    p {
      border: 1px solid black;
    }

    img {
      height: 115px;
      width: 190px;
    }

    @media (max-width:640px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="boxleft">
      <p>Text1</p>
      <p>Text2</p>
    </div>
    <div id="boxright">
      <img src="bhagat singh image.jpg" alt="bhagat image">
    </div>
  </div>
</body>

</html>
