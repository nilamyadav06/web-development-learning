<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards project</title>
  
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container{
      width: 100vw;
      height: 100vh;
      min-width: 900px;
      /* min-height: 1500px; */
      /* background-image: linear-gradient(120deg, #cab1e1 0%, #8ec5fc 100%); */
      background-image: linear-gradient(120deg, #6686e5 0%, #8083e1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card{
      width: 360px;
      height: 600px;
      background-color: white;
      border-radius: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px;
    }

    .card img{
      height: 57%;
      border-radius: 10px;

    }

    .card h2{
      font-weight: bold;
      font-size: 1.5rem;
    }

    .card p{
      font-size: 1.2em;
    }
  </style>

</head>
<body>
  <div class="container">
        <div class="card">
          <img src="QR image.png" alt="QR code"/>

          <h2>Improve your front end skills buy developing Projects</h2>

          <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quod itaque non cupiditate labore laborum suscipit soluta nihil neque?</p>

        </div>
  </div>
</body>
</html>
