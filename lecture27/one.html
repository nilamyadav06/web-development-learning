<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>card2</title>
  <style>
  *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .container{
      width: 100vw;
      height: 100vh;
      min-width: 900px;
      /* min-height: 1500px; */
      /* background-image: linear-gradient(120deg, #cab1e1 0%, #8ec5fc 100%); */
      background-image: linear-gradient(120deg, #95abef 0%, #9c9eda 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card{
      width: 400px;
      height: 600px;
      background-color: white;
      border-radius: 20px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .card img{
      width: 100%;
      height: 30%;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    } 

    .textBox{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 75%;
      text-align: center;
    }

    #amountBox{
      width: 80%;
      height: 10%;
      background-color: #9bc0f7;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      padding-right: 20px;
      padding-left: 20px;
    }
      .leftBox{
        width: fit-content;
        display: flex;
        gap: 15px;
        height: 100%;
        align-items: center;

      }

      .rightBox{
        display: flex;
        align-items: center;
      }

      .imgBox img{
        mix-blend-mode: multiply;
        height: 40px;
        width: 50px;
      }
    #paymentButton{
      width: 80%;
      height: 9%;
      border-radius: 10px;
      background-color: #131b66;
      color: white;
      /* box-shadow: rgba(12, 12, 12, 0.35) 0px 5px 15px; */
      box-shadow: rgba(0, 0, 0, 0.25) 0px 14px 28px, rgba(0, 0, 0, 0.22) 0px 10px 10px;
    }

    .cancelBox a{
      text-decoration: none;
      color: rgb(51, 49, 49);
      font-weight: bold;
      font-size: large;
      }

      

    </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="image2.jpg" alt="image2"/>

      <div class="textBox">
      <h2>
        Order Summary
      </h2>

      <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Architecto vitae doloremque exercitationem explicabo a. Et vitae accusantium eius eligendi facere!</p>
      </div>

      <div id="amountBox">
        <div class="leftBox">
          <div class="imgBox">
            <img src="music.png"alt="image3"/>
          </div>

          <div id="textAmountBox">
            <p>Amount</p>
            <p>$999.9/year</p>
          </div>

        </div>

        <div class="rightBox">
          <a href="#">Change</a>

        </div>

      </div>

      <button id="paymentButton">
        Proceed to Payment
      </button>

      <div class="cancelBox">
        <a href="#">Cancel Order</a>
      </div>
      
    </div>

  </div>
</body>
</html>
