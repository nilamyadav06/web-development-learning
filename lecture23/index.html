<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background-color: beige;
      border: 5px solid black;
    }

    .box {
      width: 350px;
      height: 80px;
      background-color: blue;
      border: 2px solid black;
      border-radius: 10px;
      margin: 10px;
      position: relative;
      animation-name: rightMovement;
      animation-duration: 5s;
      animation-iteration-count: infinite;
      animation-delay: 1s;
      /* animation-timing-function: cubic-bezier(1, -0.4, 1, 1); */
      animation-timing-function: ease-in;
      animation-direction: alternate;
      animation-fill-mode: none;

    }

    @keyframes rightMovement {
      from {
        top: 0;
        left: 0;
      }

      to {
        top: 0;
        left: 800px;
      }
    }

    #box2 {
      width: 350px;
      height: 80px;
      background-color: blue;
      border: 2px solid black;
      border-radius: 10px;
      margin: 10px;
      position: relative;
      animation-name: leftMovement;
      animation-duration: 5s;
      animation-delay: 1s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      animation-fill-mode: none;

    }

    @keyframes leftMovement {
      from {
        top: 430px;
        left: 800px;
      }

      to {
        top: 430px;
        left: 0px;
      }

    }

    #circle {
      width: 100px;
      height: 100px;
      background-color: blue;
      border: 2px solid black;
      border-radius: 50px;
      margin: 10px;
      position: relative;
      top: 30%;
      left: 40%;
      animation: 10s ease-in-out 0s infinite alternate-reverse none running circleMovement;

    }

    @keyframes circleMovement {
      0% {
        top: 1%;
        left: 5%;
      }

      30% {
        top: 5%;
        left: 90%;
      }

      60% {
        top: 40%;
        left: 10%;
      }

      100% {
        top: 65%;
        left: 60%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box"></div>
    <div id="box2"></div>
    <div id="circle"></div>

  </div>
</body>

</html>
