<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>

<body>

  <form>

    <fieldset>
      <legend>HTML Form Dummy</legend>

      <label for="email">Enter Email ID:</label>
      <input type="text" id="email" placeholder="enter your email id">

      <br />
      <br />

      <label for="passord">Enter Password:</label>
      <input type="text" id="password">

      <br />
      <br />

      <label for="name">Enter Name:</label>
      <input type="text" placeholder="user name" id="name">

      <br />
      <br />

      <label for="phone no">Enter Phone No:</label>
      <input type="text" id="phone no">

      <br />
      <br />

      <input type="submit" value="submit">

      <br />
      <br />

      <label for="datepicker">Choose Date:</label>
      <input type="date" id="datepicker">

      <br />
      <br />

      <label for="selectorl">Choose your Dish:</label>
      <select name="dishes" id="selectorl">
        <option value="maggi">Maggi</option>
        <option value="kurkure">Kurkure</option>
        <option value="chips">Chips</option>
        <option value="motu patlu">Motu Patlu</option>
      </select>

      <br />
      <br />

      <button>Main hu button</button>

      <br />
      <br />
      <textarea name="textarea" id="textarea" cols="30" rows="10" placeholder="enter text here"></textarea>

    </fieldset>

  </form>

</body>

</html>
